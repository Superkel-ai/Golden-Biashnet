<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ================= BASIC ================= -->

  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Mobile Optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title -->
  <title>Golden Biashnet | Buy & Sell Products, Houses, Services & Adverts</title>

  <!-- SEO Description -->
  <meta name="description"
    content="Golden Biashnet is a modern Kenyan marketplace to buy and sell products, houses, services, jobs and adverts easily." />

  <!-- Keywords -->
  <meta name="keywords"
    content="Kenya marketplace, buy and sell Kenya, houses Kenya, services Kenya, marketplace Kenya, Golden Biashnet" />

  <!-- Author -->
  <meta name="author" content="Golden Biashnet" />



  <!-- ================= PWA ================= -->

  <!-- Theme Color -->
  <meta name="theme-color" content="#F4B400" />

  <meta name="application-name" content="Golden Biashnet" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Favicon -->
  <link rel="icon" href="/biash192.png" />

  <!-- Apple Icon -->
  <link rel="apple-touch-icon" href="/biash192.png" />



  <!-- ================= PERFORMANCE ================= -->

  <!-- Preconnect for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />



  <!-- ================= FONTS ================= -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />



  <!-- ================= SOCIAL PREVIEW ================= -->

  <!-- Open Graph -->
  <meta property="og:title" content="Golden Biashnet Marketplace" />
  <meta property="og:description"
    content="Buy and sell products, houses, services and opportunities on Golden Biashnet." />
  <meta property="og:image" content="https://golden-biashnet.web.app/biash512.jpeg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://golden-biashnet.web.app" />



  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Golden Biashnet Marketplace" />
  <meta name="twitter:description"
    content="Discover products, services, houses and opportunities near you." />
  <meta name="twitter:image" content="https://golden-biashnet.web.app/biash512.jpeg" />
  <meta name="twitter:site" content="@GoldenBiashnet" />


  


  <!-- ================= PWA MOBILE ================= -->

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Golden Biashnet" />



  <!-- ================= SECURITY ================= -->

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:;" />



</head>



<body>

  <noscript>
    You need to enable JavaScript to run Golden Biashnet Marketplace.
  </noscript>

  <!-- React Root -->
  <div id="root"></div>

</body>

</html>
